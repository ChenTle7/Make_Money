name: 港股ETF日报生成与部署

on:
  schedule:
    # 工作日 20:00 北京时间 = 12:00 UTC（可能不准时，cron-job.org作为主要触发）
    - cron: '0 12 * * 1-5'
  workflow_dispatch:  # 手动触发 / cron-job.org API触发

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -q --prefer-binary akshare jinja2 matplotlib requests pandas numpy

      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei || true
          fc-cache -f 2>/dev/null || true
          rm -rf ~/.cache/matplotlib
          python -c "import matplotlib.font_manager as fm; print([f.name for f in fm.fontManager.ttflist if 'Wen' in f.name or 'CJK' in f.name or 'Noto' in f.name][:5])" || true

      - name: Generate daily report
        run: python run_daily.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/output
          keep_files: true

      - name: Send email notification
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: 465
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
          PAGES_URL: https://chentle7.github.io/Make_Money
        run: python notify.py
